name: Azure Connection Test

on:
  workflow_dispatch:
  push:
    branches:
      - Main
    paths:
      - .github/workflows/azure-connection-test.yml

permissions:
  id-token: write
  contents: read

jobs:
  verify-azure-oidc:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: 084dca93-68a4-4a77-beb0-92771868defc
          tenant-id: 528589ce-e43f-4e59-82f7-319d7864c596
          subscription-id: f3f4ff2b-bd08-418e-a492-f1244e4b30e8

      - name: Verify subscription and resource-group access
        shell: bash
        run: |
          set -euo pipefail
          echo "Signed in with GitHub OIDC."
          az account show --query '{subscription:name, subscriptionId:id, tenantId:tenantId}' -o json
          az group show \
            --name planned-out-xavier-rg \
            --query '{name:name, location:location, provisioningState:properties.provisioningState}' \
            -o json

      - name: Confirm no deployment performed
        run: echo "Connection test only. No Azure resources were deployed by this workflow."
